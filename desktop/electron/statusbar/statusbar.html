<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>Isabel · estado</title>
    <link rel="stylesheet" href="statusbar.css" />
  </head>
  <body data-mode="collapsed" data-phase="idle" data-mic="on">
    <div class="handle" aria-hidden="true"></div>
    <div class="bar" id="bar">
      <span class="dot" aria-hidden="true"></span>
      <span class="name">Isabel</span>
      <span class="label" id="label" aria-live="polite">En espera</span>
      <form class="write" id="write" hidden>
        <input id="text" type="text" maxlength="8000" placeholder="Escríbele a Isabel…" autocomplete="off" />
      </form>
      <div class="buttons">
        <button type="button" id="mic" title="Silenciar micrófono" aria-label="Silenciar micrófono">
          <svg viewBox="0 0 24 24" class="icon-on"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg>
          <svg viewBox="0 0 24 24" class="icon-off"><path d="M9 9V6a3 3 0 0 1 5.6-1.5M15 10v1a3 3 0 0 1-4.5 2.6" /><path d="M5.5 11a6.5 6.5 0 0 0 10.3 5.3M18.5 11a6.5 6.5 0 0 1-.5 2.5M12 17.5V21M4 4l16 16" /></svg>
        </button>
        <button type="button" id="type" title="Escribir" aria-label="Escribir">
          <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6" /></svg>
        </button>
        <button type="button" id="open" title="Abrir Isabel" aria-label="Abrir Isabel">
          <svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 13.5V18a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 5 18V9a1.5 1.5 0 0 1 1.5-1.5H11" /></svg>
        </button>
      </div>
    </div>
    <p class="answer" id="answer" hidden></p>
    <script src="statusbar.js"></script>
  </body>
</html>
