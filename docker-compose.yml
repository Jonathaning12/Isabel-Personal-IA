# Local stack: API + Qdrant. Ports are bound to 127.0.0.1 only (not exposed to the network).
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      # The Qdrant image has no curl; probe the HTTP port with bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Builds the sandbox image used to run agent-written code, then exits.
  # The API starts a fresh, locked-down container from this image for every run.
  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    image: assistant-sandbox:latest
    command: ["python", "-c", "print('sandbox image ready')"]
    network_mode: none

  # Local voice (Piper text to speech), used when the Gemini voice is out of quota. No
  # published port and no internet at runtime: only the API talks to it.
  voice:
    build:
      context: services/voice
    image: assistant-voice:latest
    environment:
      LOCAL_TTS_SPEED: ${LOCAL_TTS_SPEED:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8100/health'))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      # Inside Docker, Qdrant is reached by its service name, not localhost.
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      LOCAL_VOICE_URL: ${LOCAL_VOICE_URL:-http://voice:8100}
      # The Obsidian vault is mounted at /vault only when OBSIDIAN_VAULT is set in .env.
      VAULT_DIR: ${OBSIDIAN_VAULT:+/vault}
      # Your projects folder (e.g. Documents) at /projects, only when PROJECTS_HOST is set.
      PROJECTS_DIR: ${PROJECTS_HOST:+/projects}
      PROJECTS_HOST_PATH: ${PROJECTS_HOST:-}
      # Your git identity (name/email for commits), read-only, when GIT_CONFIG_HOST is set.
      GIT_CONFIG_GLOBAL: ${GIT_CONFIG_HOST:+/home/app/.gitconfig-host}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Conversations (checkpoints.sqlite) and the audit log stay on your disk.
      - ./data:/app/data
      # Your Obsidian vault (read freely; writes always need your approval in the app/CLI).
      # Without OBSIDIAN_VAULT an empty placeholder folder is mounted and notes are disabled.
      - "${OBSIDIAN_VAULT:-./data/no-vault}:/vault"
      # Folders and git repos: reading is free; create folder / commit / push need approval.
      - "${PROJECTS_HOST:-./data/no-projects}:/projects"
      - "${GIT_CONFIG_HOST:-./data/no-gitconfig}:/home/app/.gitconfig-host:ro"
      # The API needs Docker to start sandbox containers. This gives the API (trusted code)
      # control of Docker; the agent-written code runs in the sandbox, which gets nothing.
      - /var/run/docker.sock:/var/run/docker.sock
    # Lets the non-root API user use the Docker socket (macOS: 0; Linux: see .env.example).
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      qdrant:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 15s
      retries: 5

volumes:
  qdrant_data:
