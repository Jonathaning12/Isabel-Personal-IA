[project]
name = "assistant"
version = "0.1.0"
description = "Private, always-on personal AI assistant powered by NVIDIA models on Nebius Token Factory."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "openai>=3.40.0",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
assistant = "assistant.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The repo has a docker/ folder; the `docker` import is the third-party SDK.
known-third-party = ["docker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: real calls to Nebius (opt-in, run with -m live)",
    "integration: requires docker compose services",
]
addopts = "-m 'not live and not integration'"
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
